# SonarQube Community en Docker (VM-TOOLS). Requiere en el host:
#   vm.max_map_count=524288   (lo deja persistente infra/setup-vm-tools.sh)
#
#   cp env.example .env && nano .env   # contraseña de la base de datos
#   docker compose up -d               # UI en :9000 (usuario inicial admin / admin: cambiarla)
name: sonarqube

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?define SONAR_DB_PASSWORD en infra/sonarqube/.env}
      POSTGRES_DB: sonar
    volumes:
      - sonar-db:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:10.7.0-community
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"

volumes:
  sonar-db:
  sonar-data:
  sonar-extensions:
  sonar-logs:
