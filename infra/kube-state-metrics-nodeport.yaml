# kube-state-metrics publica su Service como headless; para que Prometheus (en
# VM-TOOLS) lo alcance por IP privada se añade un Service NodePort aparte.
# (El rango de NodePort es 30000-32767, por eso 30808 y no 8080.)
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics-np
  namespace: kube-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
      nodePort: 30808
