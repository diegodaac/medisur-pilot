# Configuración de SonarScanner. La URL y el token los inyecta Jenkins
# (withSonarQubeEnv); aquí NO va ningún secreto.
sonar.projectKey=medisur-pilot
sonar.projectName=MediSur Pilot
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Informe de cobertura generado por: pytest --cov=app --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml

# Las pruebas no cuentan como código a cubrir.
sonar.coverage.exclusions=tests/**
