apiVersion: v1
kind: Service
metadata:
  name: medisur-api
  namespace: medisur
  labels:
    app: medisur-api
spec:
  type: NodePort
  selector:
    app: medisur-api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080     # la prueba de humo y `curl /version` entran por <IP-VM-K8S>:30080
