# PLANTILLA: este archivo NO se aplica. Solo documenta la forma del Secret.
# El Secret real lo crea Jenkins en cada despliegue, con el valor guardado en
# Jenkins Credentials (id: medisur-api-key):
#
#   kubectl -n medisur create secret generic medisur-api-secret \
#     --from-literal=APP_API_KEY="$API_KEY" --dry-run=client -o yaml | kubectl apply -f -
#
# Nunca se escribe el valor real en el repositorio.
apiVersion: v1
kind: Secret
metadata:
  name: medisur-api-secret
  namespace: medisur
type: Opaque
stringData:
  APP_API_KEY: "REEMPLAZAR_LO_INYECTA_JENKINS"
