# Plantilla de Prometheus. El contenedor sustituye K8S_PRIVATE_IP (variable de
# entorno definida en monitoring/.env) al arrancar; ver docker-compose.yml.
# Los secretos (token del ServiceAccount, CA) viven en monitoring/secrets/ (ignorado por git).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ---- Prometheus se vigila a sí mismo ----
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ---- Grafana ----
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # ---- Jenkins (plugin Prometheus -> /prometheus) ----
  - job_name: jenkins
    metrics_path: /prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # ---- node_exporter de las dos VMs (9100 por IP privada) ----
  - job_name: node-tools
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels: { vm: vm-tools }

  - job_name: node-k8s
    static_configs:
      - targets: ["K8S_PRIVATE_IP:9100"]
        labels: { vm: vm-k8s }

  # ---- kube-state-metrics (NodePort 30808 en VM-K8S) ----
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["K8S_PRIVATE_IP:30808"]

  # ---- Pods de la app, uno por uno, a través del proxy del API server ----
  # No se hace scrape por el Service: con 2 réplicas los contadores saldrían incoherentes.
  - job_name: medisur-pods
    scheme: https
    authorization:
      credentials_file: /etc/prometheus/secrets/k8s-token
    tls_config:
      insecure_skip_verify: true      # el certificado del API server es autofirmado de MicroK8s
    kubernetes_sd_configs:
      - role: pod
        api_server: https://K8S_PRIVATE_IP:16443
        authorization:
          credentials_file: /etc/prometheus/secrets/k8s-token
        tls_config:
          insecure_skip_verify: true
        namespaces:
          names: [medisur]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: medisur-api
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      # La petición real va al API server, que la reenvía al pod.
      - target_label: __address__
        replacement: K8S_PRIVATE_IP:16443
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name]
        separator: ";"
        regex: "(.*);(.*)"
        replacement: /api/v1/namespaces/$1/pods/$2:8000/proxy/metrics
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance

  # ---- cAdvisor: CPU y memoria por pod, vía el proxy del API server hacia el kubelet ----
  - job_name: cadvisor
    scheme: https
    authorization:
      credentials_file: /etc/prometheus/secrets/k8s-token
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
      - role: node
        api_server: https://K8S_PRIVATE_IP:16443
        authorization:
          credentials_file: /etc/prometheus/secrets/k8s-token
        tls_config:
          insecure_skip_verify: true
    relabel_configs:
      - target_label: __address__
        replacement: K8S_PRIVATE_IP:16443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_node_name]
        target_label: instance

  # ---- Estado de los servicios (Jenkins, SonarQube, Prometheus, Grafana) con blackbox ----
  - job_name: blackbox-servicios
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://host.docker.internal:8080/login"]
        labels: { service: Jenkins }
      - targets: ["http://host.docker.internal:9000/api/system/status"]
        labels: { service: SonarQube }
      - targets: ["http://prometheus:9090/-/healthy"]
        labels: { service: Prometheus }
      - targets: ["http://grafana:3000/api/health"]
        labels: { service: Grafana }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
